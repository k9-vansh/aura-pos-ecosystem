services:
  - type: web
    name: aura-pos-backend
    env: python
    plan: free
    region: oregon
    rootDir: pos/backend
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT pos_backend.asgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: BRAND_NAME
        value: "Aura Salon & Spa"
      - key: SERVE_MEDIA_FILES
        value: "True"
      - key: DB_ENGINE
        value: "sqlite"
      - key: DEMO_MODE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.3"

