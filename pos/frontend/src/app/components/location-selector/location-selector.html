<div style="position: relative; display: flex; align-items: center; gap: 8px;">
  <div class="custom-center-dropdown" (click)="toggleOpen()" [class.active]="isOpen">
    <span class="dropdown-text">{{ selectedCenterName }}</span>
    <i class="fa fa-chevron-down dropdown-icon"></i>
  </div>

  <div class="dropdown-overlay" *ngIf="isOpen" (click)="close()"></div>

  <!-- one location -->
  <div class="custom-dropdown-menu" *ngIf="isOpen && !multi">
    <div class="dropdown-menu-item" *ngIf="hasGlobalAccess" (click)="selectCenter(null)"
      [class.selected]="selectedCenterId === null">
      All Locations
    </div>
    <div class="dropdown-menu-item" *ngFor="let center of sortedCenters" (click)="selectCenter(center.id)"
      [class.selected]="selectedCenterId === center.id">
      {{ center.display_name || center.center_name || center.name }}
    </div>
  </div>

  <!-- any number of locations -->
  <div class="custom-dropdown-menu multi-menu" *ngIf="isOpen && multi">
    <div class="multi-head">
      <button type="button" class="multi-all" *ngIf="hasGlobalAccess" (click)="pickAll()">All locations</button>
      <span class="multi-count" *ngIf="!hasGlobalAccess">{{ pending.length }} selected</span>
      <button type="button" class="multi-apply" (click)="apply()">Apply</button>
    </div>
    <label class="dropdown-menu-item multi-item" *ngFor="let center of sortedCenters"
      [class.selected]="isPicked(center.id)">
      <input type="checkbox" [checked]="isPicked(center.id)" (change)="togglePick(center.id)">
      <span>{{ center.display_name || center.center_name || center.name }}</span>
    </label>
  </div>
</div>
