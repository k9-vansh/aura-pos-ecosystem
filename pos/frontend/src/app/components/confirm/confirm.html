<div class="cf-backdrop" *ngIf="svc.request() as req" (click)="svc.answer(req.input ? null : false)">
  <div class="cf-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="cf-icon" [class.cf-danger]="req.destructive">
      <svg *ngIf="req.destructive" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <svg *ngIf="!req.destructive" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
    </div>
    <div class="cf-message">{{ req.message }}</div>
    <input *ngIf="req.input" class="cf-input" type="text" autofocus
           [placeholder]="req.input.placeholder" [(ngModel)]="req.input.value"
           (keydown.enter)="submit(req)">
    <div class="cf-actions">
      <button type="button" class="cf-btn cf-cancel" (click)="svc.answer(req.input ? null : false)">Cancel</button>
      <button type="button" class="cf-btn cf-ok" [class.cf-ok-danger]="req.destructive" (click)="submit(req)">{{ req.confirmLabel }}</button>
    </div>
  </div>
</div>
