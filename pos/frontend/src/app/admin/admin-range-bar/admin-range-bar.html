<div class="range-bar">
  <div class="range-dates">
    <input type="date" [ngModel]="svc.currentFromDate" (ngModelChange)="svc.setFromDate($event)" (change)="svc.triggerApply()" aria-label="From date">
    <span class="range-to">to</span>
    <input type="date" [ngModel]="svc.currentToDate" (ngModelChange)="svc.setToDate($event)" (change)="svc.triggerApply()" aria-label="To date">
  </div>
  <button type="button" class="range-btn range-apply" (click)="svc.triggerApply()">Apply</button>
  <button type="button" class="range-icon" title="Export to Excel" aria-label="Export to Excel" (click)="svc.triggerExport()">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16"><path d="M9.293 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V4.707A1 1 0 0 0 13.707 4L10 .293A1 1 0 0 0 9.293 0M9.5 3.5v-2l3 3h-2a1 1 0 0 1-1-1M5.884 6.68 8 9.219l2.116-2.54a.5.5 0 1 1 .768.641L8.651 10l2.233 2.68a.5.5 0 0 1-.768.64L8 10.781l-2.116 2.54a.5.5 0 0 1-.768-.641L7.349 10 5.116 7.32a.5.5 0 1 1 .768-.64"/></svg>
  </button>
</div>
