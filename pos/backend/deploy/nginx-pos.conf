# nginx for the POS.
#
# Three jobs: terminate TLS, serve static and uploaded files directly, and pass
# everything else to gunicorn. Django was doing all three itself, over plain
# http on a bare IP.
#
# CHANGE ME: server_name, and the two alias paths.

upstream pos_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Plain http exists only to send people to https.
server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;   # CHANGE ME
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;   # CHANGE ME

    # `certbot --nginx` fills these in.
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # The big lists (products, invoices, services) are 0.5-1.5 MB of JSON, which
    # compresses to roughly a tenth of that. Without this every till pulled the
    # whole thing over the wire uncompressed.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # Spreadsheet imports. The importers cap at 5,000 rows; this is the
    # transport-level limit.
    client_max_body_size 25M;

    # ── Files nginx serves itself ────────────────────────────────────────────
    # Django was serving uploaded media, which occupied a worker for the whole
    # of every image download.
    location /static/ {
        alias /srv/pos/backend/staticfiles/;          # CHANGE ME
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/pos/backend/media/;                # CHANGE ME
        expires 7d;
        access_log off;
    }

    # ── The chat websocket ───────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://pos_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat socket sits idle for long stretches; do not cut it.
        proxy_read_timeout 3600s;
    }

    # ── Everything else ──────────────────────────────────────────────────────
    location / {
        proxy_pass http://pos_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit log records this address. Set
        # AUDIT_LOG_TRUST_FORWARDED_FOR=1 only because THIS proxy overwrites the
        # header - without a proxy in front, a caller could choose the IP
        # recorded against their own actions.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
